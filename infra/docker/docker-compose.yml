version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: medintel_backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - qdrant
      - redis

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: medintel_frontend
    ports:
      - "3000:80"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medintel
      POSTGRES_PASSWORD: medintel
      POSTGRES_DB: medintel
    ports:
      - "5432:5432"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
